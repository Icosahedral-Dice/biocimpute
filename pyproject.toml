[project]
name = "biocimpute"
version = "0.1.0"
description = "Imputation for microarray data: a Python port of Bioconductor's impute (KNN)"
readme = "README.md"
authors = [
    { name = "Mingsen Wang", email = "mingsen.wang.sh@gmail.com" }
]
requires-python = ">=3.10"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
keywords = ["imputation", "knn", "microarray", "gene expression", "bioconductor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2.2.6",
]

[project.urls]
Homepage = "https://github.com/Icosahedral-Dice/biocimpute"
Repository = "https://github.com/Icosahedral-Dice/biocimpute"
Issues = "https://github.com/Icosahedral-Dice/biocimpute/issues"
"Original R package" = "https://bioconductor.org/packages/release/bioc/html/impute.html"

[project.optional-dependencies]
numba = [
    "numba>=0.68.0",
]
pandas = [
    "pandas>=2.3.3",
]

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "maturin>=1.15.0",
    "numba>=0.68.0",
    "pandas>=2.3.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "biocimpute._kernels._rust"
profile = "release"

[tool.uv]
# Rebuild the extension when the Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/Cargo.toml" },
    { file = "rust/src/**/*.rs" },
]
