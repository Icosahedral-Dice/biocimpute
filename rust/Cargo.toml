[package]
name = "biocimpute"
version = "0.1.0"
edition = "2024"
description = "Rust kernels for biocimpute (port of Bioconductor impute's knnimpute.f)"
license = "GPL-2.0-only"
publish = false

[lib]
name = "_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.30.0"
pyo3 = { version = "0.30", features = ["abi3-py310"] }

[profile.release]
codegen-units = 1
lto = "fat"
