name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      # Builds the Rust extension; tests run against both the rust and numba backends.
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      # uv run puts the project's Python first on PATH for PyO3.
      - run: uv run cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: uv run cargo test --manifest-path rust/Cargo.toml
